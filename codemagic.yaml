workflows:
  telegram-ios-simulator:
    name: Telegram iOS - simulator sanity build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: 26.2
      vars:
        BAZEL_CACHE_DIR: "$CM_BUILD_DIR/../telegram-bazel-cache"
        BUILD_NUMBER: "$PROJECT_BUILD_NUMBER"
        APP_BUNDLE_ID: "org.pranktelegram.client"
        APPLE_TEAM_ID: "0000000000"
      groups:
        - telegram_api
    cache:
      cache_paths:
        - $HOME/Library/Caches/bazel
        - $CM_BUILD_DIR/../telegram-bazel-cache
    scripts:
      - name: Validate required secrets
        script: |
          set -euo pipefail
          test -n "${TELEGRAM_API_ID:-}" || { echo "Missing TELEGRAM_API_ID in Codemagic group telegram_api"; exit 1; }
          test -n "${TELEGRAM_API_HASH:-}" || { echo "Missing TELEGRAM_API_HASH in Codemagic group telegram_api"; exit 1; }
          echo "Secrets are present."
      - name: Show tool versions
        script: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          python3 --version
      - name: Install Metal toolchain
        script: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
      - name: Initialize Telegram submodules
        script: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive
      - name: Create Telegram build configuration
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          cfg = {
              "bundle_id": os.environ.get("APP_BUNDLE_ID", "org.pranktelegram.client"),
              "api_id": os.environ["TELEGRAM_API_ID"],
              "api_hash": os.environ["TELEGRAM_API_HASH"],
              "team_id": os.environ.get("APPLE_TEAM_ID", "0000000000"),
              "app_center_id": "0",
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "ptg",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
          }
          path = pathlib.Path("build-system/codemagic-development-configuration.json")
          path.write_text(json.dumps(cfg, indent=2) + "\n")
          print(f"Wrote {path}")
          PY
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$BAZEL_CACHE_DIR" \
            generateProject \
            --configurationPath=build-system/codemagic-development-configuration.json \
            --xcodeManagedCodesigning \
            --disableProvisioningProfiles
      - name: Build simulator target
        script: |
          set -euo pipefail
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath=build-system/codemagic-development-configuration.json \
            --buildNumber="${BUILD_NUMBER:-1}" \
            --configuration=debug_sim_arm64 \
            --xcodeManagedCodesigning \
            --disableProvisioningProfiles
    artifacts:
      - build/**/Telegram*.app
      - bazel-bin/**/*.app
      - bazel-out/**/*.log
      - /tmp/xcodebuild_logs/*.log

  telegram-ios-ipa-development:
    name: Telegram iOS - device IPA for Sideloadly
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: 26.2
      vars:
        BAZEL_CACHE_DIR: "$CM_BUILD_DIR/../telegram-bazel-cache"
        BUILD_NUMBER: "$PROJECT_BUILD_NUMBER"
        APP_BUNDLE_ID: "ph.telegra.Telegraph"
        APPLE_TEAM_ID: "C67CF9S4VU"
      groups:
        - telegram_api
    cache:
      cache_paths:
        - $HOME/Library/Caches/bazel
        - $CM_BUILD_DIR/../telegram-bazel-cache
    scripts:
      - name: Validate required secrets
        script: |
          set -euo pipefail
          test -n "${TELEGRAM_API_ID:-}" || { echo "Missing TELEGRAM_API_ID"; exit 1; }
          test -n "${TELEGRAM_API_HASH:-}" || { echo "Missing TELEGRAM_API_HASH"; exit 1; }
          echo "Secrets are present."
      - name: Install Metal toolchain
        script: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
      - name: Import fake signing certificates
        script: |
          set -euo pipefail
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
      - name: Initialize Telegram submodules
        script: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive
      - name: Create Telegram build configuration
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          cfg = {
              "bundle_id": os.environ["APP_BUNDLE_ID"],
              "api_id": os.environ["TELEGRAM_API_ID"],
              "api_hash": os.environ["TELEGRAM_API_HASH"],
              "team_id": os.environ.get("APPLE_TEAM_ID", "0000000000"),
              "app_center_id": "0",
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "ptg",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
          }
          path = pathlib.Path("build-system/codemagic-development-configuration.json")
          path.write_text(json.dumps(cfg, indent=2) + "\n")
          print(f"Wrote {path}")
          PY
      - name: Generate Xcode project for Sideloadly IPA
        script: |
          set -euo pipefail
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$BAZEL_CACHE_DIR" \
            generateProject \
            --configurationPath=build-system/codemagic-development-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --disableExtensions
      - name: Build device app
        script: |
          set -euo pipefail
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath=build-system/codemagic-development-configuration.json \
            --buildNumber="${BUILD_NUMBER:-1}" \
            --configuration=release_arm64 \
            --codesigningInformationPath=build-system/fake-codesigning \
            --disableExtensions
      - name: Package IPA for Sideloadly
        script: |
          set -euo pipefail
          OUTPUT_IPA="$CM_BUILD_DIR/Telegram-Sideloadly.ipa"
          EXISTING_IPA="$(find bazel-bin bazel-out -name Telegram.ipa -type f | head -1 || true)"
          if [ -n "$EXISTING_IPA" ]; then
            cp "$EXISTING_IPA" "$OUTPUT_IPA"
          else
            APP_PATH="$(find bazel-bin bazel-out -name Telegram.app -type d | head -1 || true)"
            test -n "$APP_PATH" || { echo "Telegram.app not found under bazel-bin or bazel-out"; find bazel-bin bazel-out -maxdepth 5 \( -name '*.app' -o -name '*.ipa' \) -print || true; exit 1; }
            rm -rf "$CM_BUILD_DIR/sideloadly-ipa"
            mkdir -p "$CM_BUILD_DIR/sideloadly-ipa/Payload"
            cp -R "$APP_PATH" "$CM_BUILD_DIR/sideloadly-ipa/Payload/Telegram.app"
            (cd "$CM_BUILD_DIR/sideloadly-ipa" && zip -qry "$OUTPUT_IPA" Payload)
          fi
          ls -lh "$OUTPUT_IPA"
    artifacts:
      - Telegram-Sideloadly.ipa
      - bazel-bin/**/*.ipa
      - bazel-bin/**/*.app
      - bazel-out/**/*.log
